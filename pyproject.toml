[project]
name = "secretdataagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vignesh", email = "vignesh.pandian1992@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "grandalf>=0.8",
    "langchain>=1.3.16",
    "langchain-anthropic>=1.6.1",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.3.5",
    "langgraph>=1.2.11",
    "neo4j>=6.2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "sqlglot>=30.17.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
secretdataagent = "secretdataagent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
